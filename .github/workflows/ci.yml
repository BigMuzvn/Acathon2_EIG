name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code, tests et navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier les fichiers suivis, le code, les tests et la compilation
        run: npm run check
      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium
      - name: Vérifier les parcours navigateur
        run: npm run test:e2e
      - name: Conserver les captures en cas d’échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostic-navigateur
          path: output/
          if-no-files-found: ignore
          retention-days: 7
